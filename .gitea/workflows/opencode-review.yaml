name: OpenCode Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

jobs:
  opencode-review:
    concurrency:
      group: opencode-review-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    # Adjust runs-on and container to match your runner configuration
    runs-on: linux
    container: catthehacker/ubuntu:act-latest
    steps:
      - name: Checkout trusted review configuration
        uses: actions/checkout@v4
        with:
          # The configuration defines the prompt, approval rules and executable
          # tools, and runs with secrets: take it from the base commit, never
          # from the PR. The review itself reads the PR through the Gitea API.
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          sparse-checkout: .opencode-review
          persist-credentials: false

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        working-directory: .opencode-review
        run: ~/.bun/bin/bun install

      - name: Install opencode
        run: ~/.bun/bin/bun add -g opencode-ai

      - name: Run code review
        env:
          # IMPORTANT: Use custom config directory to avoid conflicts with user's .opencode/
          # See: https://opencode.ai/docs/config/#custom-directory
          OPENCODE_CONFIG_DIR: ${{ github.workspace }}/.opencode-review  # Base-commit checkout above
          # Model configuration - use format: provider/model-id
          # Examples: deepseek/deepseek-chat, anthropic/claude-sonnet-4-5, openai/gpt-4o
          MODEL: deepseek/deepseek-chat
          # OPENCODE_REFRESH_MODELS: "false"  # Skip catalog refresh in offline environments
          # Review template and team standards (see README)
          # REVIEW_TEMPLATE: standard    # standard | concise | thorough | security | performance | compliance, or a path/URL
          # REVIEW_RULES: ""             # Team standards: repo paths (read from the PR base), owner/repo:path@ref, or URLs
          # Gitea API configuration
          GITEA_TOKEN: ${{ secrets.OPENCODE_GIT_TOKEN }}
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          # LLM Provider API keys (configure at least one)
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # PR information
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          # Debug (optional)
          OPENCODE_LOG_LEVEL: info
        run: |
          # Refresh the model catalog; keep cached models usable if offline.
          if [ "${OPENCODE_REFRESH_MODELS:-true}" != "false" ]; then
            echo "Refreshing models cache..."
            if ! opencode models --refresh >/dev/null; then
              echo "[WARN] Failed to refresh models; continuing with the cached model catalog" >&2
            fi
          fi

          bun .opencode-review/run-review.ts \
            "Please review PR #${PR_NUMBER} in ${REPO_OWNER}/${REPO_NAME}. \
             Fetch the diff, analyze the code changes, and submit a detailed review \
             with line-level comments for any issues found."
