name: opencode-review-lab
services:
  gitea:
    image: gitea/gitea:1.24.6
    ports:
      - "127.0.0.1:${GITEA_LAB_PORT:-13010}:3000"
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://localhost:${GITEA_LAB_PORT:-13010}/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__repository__DEFAULT_BRANCH: main
    volumes:
      - gitea-data:/data
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.0
    ports:
      - "127.0.0.1:${FORGEJO_LAB_PORT:-13011}:3000"
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__server__ROOT_URL: http://localhost:${FORGEJO_LAB_PORT:-13011}/
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__repository__DEFAULT_BRANCH: main
    volumes:
      - forgejo-data:/data
volumes:
  gitea-data:
  forgejo-data:
