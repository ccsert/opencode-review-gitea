# Build and publish Docker image to GitHub Container Registry
#
# Triggers:
#   - Push to main branch
#   - Push version tags (v*.*.*)
#   - Manual dispatch
#   - Weekly refresh of OpenCode and base image dependencies
#
# Images published to: ghcr.io/ccsert/opencode-review

name: Docker Build & Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'install.sh'
      - 'templates/**'
      - '.gitea/workflows/**'
      - '.opencode-review/**'
      - '.github/workflows/docker-publish.yaml'
      - 'tests/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'install.sh'
      - 'templates/**'
      - '.gitea/workflows/**'
      - '.opencode-review/**'
      - '.github/workflows/docker-publish.yaml'
      - 'tests/**'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (leave empty for auto)'
        required: false
        type: string
      opencode_version:
        description: 'OpenCode npm version to install'
        required: false
        default: 'latest'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/opencode-review

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Check shell syntax
        run: bash -n entrypoint.sh install.sh
      - name: Install tool dependencies
        working-directory: .opencode-review
        run: bun install --frozen-lockfile
      - name: Run regression tests
        run: bun test ./tests/*.test.ts ./.opencode-review/tests/*.test.ts

  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Manual tag input
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            # Branch name
            type=ref,event=branch
            # Semantic version tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # SHA for traceability
            type=sha,prefix=sha-,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          # An unchanged Dockerfile must still install new upstream releases.
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          build-args: |
            OPENCODE_VERSION=${{ inputs.opencode_version || 'latest' }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '## Docker Image Build Summary'
            echo ''
            echo "**Registry:** \`$REGISTRY\`"
            echo "**Image:** \`$IMAGE_NAME\`"
            echo ''
            echo '### Tags'
            echo '```'
            echo "$IMAGE_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Test the built image
  test:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Test image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} version
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} help
