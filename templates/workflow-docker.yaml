# OpenCode Review - Docker Installation Workflow Template
# 
# This workflow uses the Docker image-based installation method.
# No additional files required - just this workflow file!
#
# Installation:
#   Copy this file to .gitea/workflows/opencode-review.yaml in your repository.
#   Configure OPENCODE_GIT_TOKEN and your model provider's API key in repository secrets.
#   See README.md for optional installer-based setup.

name: OpenCode Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

jobs:
  opencode-review:
    concurrency:
      group: opencode-review-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    # Trigger on /oc or /opencode command, or on new/updated PR
    if: |
      github.event_name == 'pull_request' ||
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    
    # Use pre-built Docker image with all dependencies
    container:
      image: ghcr.io/ccsert/opencode-review:latest
      # Optional: pin to a published digest for reproducible reviews
      # image: ghcr.io/ccsert/opencode-review@sha256:<published-digest>
    
    # No checkout: the review reads the PR through the Gitea API, and PR code
    # never needs to run in a job that holds the token and model API keys.
    steps:
      - name: Run code review
        env:
          # Gitea/Forgejo configuration
          GITEA_TOKEN: ${{ secrets.OPENCODE_GIT_TOKEN }}
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          
          # Model configuration (provider/model-id format)
          # Examples: deepseek/deepseek-chat, anthropic/claude-sonnet-4-5, openai/gpt-4o
          MODEL: deepseek/deepseek-chat
          # OPENCODE_REVIEW_STATE_DIR: /persistent/review-state  # Shared durable volume, if configured
          # OPENCODE_REFRESH_MODELS: "false"  # Skip catalog refresh in offline environments
          
          # Review configuration
          REVIEW_LANGUAGE: auto          # auto | en | zh-CN
          # REVIEW_STYLE: balanced       # concise | balanced | thorough | security
          # FILE_PATTERNS: ""            # Glob patterns to filter files (e.g., "*.ts,*.go,src/**")
          # REVIEW_TEMPLATE: standard    # standard | concise | thorough | security | performance | compliance, or a path/URL
          # REVIEW_RULES: ""             # Team standards: repo paths (read from the PR base), owner/repo:path@ref, or URLs
          
          # LLM API Keys (configure the one matching your MODEL)
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          
          # LLM Gateway (optional, for LiteLLM, OpenRouter, Together AI, etc.)
          # OPENAI_BASE_URL: ""          # e.g., http://localhost:4000/v1
          
          # PR context
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # The entrypoint handles everything automatically
          /entrypoint.sh review
